services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://vorbis:${POSTGRES_PASSWORD:-local-only}@db:5432/vorbis
      UPLOAD_DIR: /app/data/uploads
    volumes:
      - vorbis_data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "3000:80"
    depends_on: [api]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vorbis
      POSTGRES_USER: vorbis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vorbis -d vorbis"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
  vorbis_data:
